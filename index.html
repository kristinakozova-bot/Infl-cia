{icon:'🛒',title:'Správa o cenách',meta:'Dokument B • štatistická správa',body:'Zdraženie <b>jedného hotela</b> ešte nedokazuje infláciu celej ekonomiky. Inflácia označuje rast <b>celkovej cenovej hladiny</b>. Niektoré jednotlivé ceny môžu pritom klesnúť.'},

const STORE='inflation_detectives_individual_v2_score_shuffle';
const fresh=()=>({name:'',current:0,completed:[],progress:{},xp:0,openedHistory:2022,showHelp:false,notes:{},optionOrders:{},wrongAnswers:0,hintsUsed:0});
let s;try{s=JSON.parse(localStorage.getItem(STORE))||fresh();}catch(e){s=fresh();}
function save(){try{localStorage.setItem(STORE,JSON.stringify(s));}catch(e){}}

const MAX_POINTS=CASES.reduce((n,c)=>n+c.steps.length,0)*10;
function fisherYates(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function prepareOptions(){
  s.optionOrders={};let lastCorrect=-1;
  CASES.forEach((c,ci)=>c.steps.forEach((t,ti)=>{
    if(!t.opts)return;
    const order=fisherYates(t.opts.map((_,i)=>i));
    if(t.kind!=='multi'){
      const where=order.indexOf(t.answer);
      if(where===lastCorrect && order.length>1){
        const choices=order.map((_,i)=>i).filter(i=>i!==where);
        const to=choices[Math.floor(Math.random()*choices.length)];
        [order[where],order[to]]=[order[to],order[where]];
      }
      lastCorrect=order.indexOf(t.answer);
    }
    s.optionOrders[ci+'_'+ti]=order;
  }));
}
function optionOrder(ci,ti,t){
  const k=ci+'_'+ti;
  if(!s.optionOrders)s.optionOrders={};
  if(!s.optionOrders[k])s.optionOrders[k]=fisherYates(t.opts.map((_,i)=>i));
  return s.optionOrders[k];
}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function P(i){return s.progress[i]||(s.progress[i]={phase:'evidence',seen:[],step:0,selection:[],feedback:null});}
function progressPercent(){let done=s.completed.length;let p=P(s.current);return Math.round((done/CASES.length+(s.completed.includes(s.current)?0:(p.phase==='evidence'?p.seen.length/3/CASES.length*.55:p.step/CASES[s.current].steps.length/CASES.length)))*100);}
function canVisit(i){return i<=s.completed.length;}

function renderIntro(){return `<section class="intro"><div class="intro-hero"><div class="eyebrow">🔍 SAMOSTATNÁ VYŠETROVACIA MISIA</div><h1>INFLATION <em>DETECTIVES</em></h1><div class="lead">Kto môže za drahú dovolenku? Sedem ekonomických záhad, jedna krajina a ty ako hlavná vyšetrovateľka alebo hlavný vyšetrovateľ.</div><div class="scene-art" aria-hidden="true"><div class="building">🧾</div><div class="arrowline"></div><div class="building high">🏨</div><div class="arrowline"></div><div class="building dark">🔍</div></div><div class="author">Autorka hry: <strong>Ing. Kristína Kozová, PhD.</strong></div></div><div class="intro-side"><div class="eyebrow">OTVORENIE SPISU</div><h2>Prevezmi vyšetrovanie.</h2><p class="muted">V Turistánii rastú ceny, hotely sa sťažujú a noviny prinášajú protichodné informácie. Ktoré tvrdenia obstojia pred dôkazmi?</p><label for="agentName"><b>Meno a priezvisko detektíva / detektívky</b></label><input id="agentName" class="inputbox" maxlength="65" placeholder="Napíš meno a priezvisko" autocomplete="off"><button class="primary" data-action="start">Začať vyšetrovanie →</button><div class="rules"><div class="rule"><i>📁</i><div><b>7 prípadov · asi 45–60 minút</b><span>Každý prípad má dôkazy, úlohy a vlastný záver.</span></div></div><div class="rule"><i>🧠</i><div><b>Žiadne tresty za chyby</b><span>Keď sa pomýliš, dostaneš pomoc a skúsiš to znova.</span></div></div><div class="rule"><i>💾</i><div><b>Automatické uloženie</b><span>Postup sa uloží v tomto prehliadači na tomto zariadení.</span></div></div></div><p class="muted twelve">Funguje aj bez internetu. Nevyžaduje registráciu a nikam neposiela tvoje odpovede.</p></div></section>`;}

function renderGame(){let c=CASES[s.current],p=P(s.current);if(s.completed.includes(s.current))return `<div class="main-grid">${nav()}<section class="panel content"><div class="eyebrow">VYRIEŠENÝ SPIS</div><h2>${esc(c.name)} ✅</h2><p>${esc(c.story)}</p><div class="case-close"><h3>Spis je uzavretý.</h3><p>Záver: ${esc(conclusions[s.current])}</p></div><button class="primary" data-action="nextcase">Pokračovať do otvoreného spisu →</button></section>${aside(c,p)}</div>`;

function renderEvidence(c,p){return `<div class="story"><div class="eyebrow">ZÁHADA</div><p>${esc(c.story)}</p></div><div class="step-label">1 / PRESKÚMAJ VŠETKY TRI DÔKAZY</div><div class="docs">${c.docs.map((d,i)=>`<div class="doc"><button data-action="evidence" data-i="${i}" aria-expanded="${p.seen.includes(i)?'true':'false'}"><span class="doc-icon">${d.icon}</span><span><strong>${esc(d.title)}</strong><small>${esc(d.meta)}</small></span><span class="stamp">${p.seen.includes(i)?'✓ OTVORENÉ':'＋ OTVORIŤ'}</span></button>${p.seen.includes(i)?`<div class="docbody">${d.body}</div>`:''}</div>`).join('')}</div><div class="flex-between"><div class="muted twelve">Otvorené dôkazy: ${p.seen.length} z 3</div><button class="primary" data-action="investigate" ${p.seen.length<3?'disabled':''}>Začať riešiť prípad →</button></div>`;}
function renderTask(c,p){let t=c.steps[p.step];if(!t)return renderCaseDone(c);const locked=Boolean(p.feedback&&p.feedback.good);const count=p.step+1;

let support=t.kind==='graph'?`<div class="lowkey">💡 Najprv rozhodni, <b>čo sa zmenilo v skutočnom svete</b>. Až potom vyber smer krivky. Graf sa doplní po vyriešení.</div><div class="chartbox" style="max-width:690px;margin:13px 0 15px">${chartSVG(t.graph,Boolean(locked))}<div class="chart-caption">${t.graph==='phillips'||t.graph==='long'?'Os X = nezamestnanosť • Os Y = inflácia':'Os X = reálny produkt (Y) • Os Y = cenová hladina (P)'}</div></div>`:s.current===5?`<div class="chartbox" style="max-width:690px;margin:13px 0 15px">${historySVG()}<div class="chart-caption">Miera inflácie podľa tabuľky v praktiku (2005–2023), v %</div><div class="timeline-years">${[2014,2016,2021,2022,2023].map(y=>`<button class="year-btn ${s.openedHistory===y?'active':''}" data-action="year" data-year="${y}">${y}</button>`).join('')}</div></div>`:'';
return `<div class="step-label">2 / VYŠETROVACIA ÚLOHA ${count} Z ${c.steps.length}</div><div class="task-question">${t.q}</div>${t.detail?`<div class="case-data">${esc(t.detail)}</div>`:''}${support}${input}${p.feedback?`<div class="feedback ${p.feedback.good?'':'bad'}" role="status"><h3>${p.feedback.good?'✓ Dôkaz potvrdený · +'+p.feedback.earned+' bodov':'↻ Ešte jeden pokus'}</h3><p>${p.feedback.good?t.why:p.feedback.message}</p></div>`:''}<div class="actions">${locked?`<button class="primary" data-action="nexttask">${count===c.steps.length?'Uzavrieť prípad →':'Ďalšia stopa →'}</button>`:`<button class="primary" data-action="check">Overiť rozhodnutie</button><button class="secondary" data-action="hint">💡 Potrebujem nápovedu</button>`}</div>${p.step===c.steps.length-1&&locked?`<div class="lowkey">V ďalšom kroku dostaneš jasný záver celého prípadu.</div>`:''}`;}

function aside(c,p){let t=p.phase==='task'?c.steps[p.step]:null;let graphType=t?.graph||({2:'cost',3:'demand',4:'stag',5:'history',6:'long'}[s.current]||'none');let show=p.feedback?.good;let drawn=chartSVG(graphType,Boolean(show));let historical=s.current===5?`<div class="note-block"><strong>🗓️ Interaktívny archív</strong><p>Vyber rok a sleduj mieru inflácie:</p><div class="timeline-years">${[2008,2014,2016,2021,2022,2023].map(y=>`<button class="year-btn ${s.openedHistory===y?'active':''}" data-action="year" data-year="${y}">${y}</button>`).join('')}</div><p><b>${s.openedHistory}:</b> ${HIST.find(x=>x[0]===s.openedHistory)?.[1].toFixed(1).replace('.',',')} %</p></div>`:'';

function chartSVG(type,after){if(!type||type==='none')return '';
if(type==='history')return historySVG();
const grid=`<line x1="54" y1="18" x2="54" y2="291" stroke="#536976" stroke-width="2"/><line x1="54" y1="291" x2="495" y2="291" stroke="#536976" stroke-width="2"/><path d="M 48 29 L 54 17 L 60 29 M 483 285 L 495 291 L 483 297" stroke="#536976" fill="none" stroke-width="2"/>`;

if(first){let shorts=`<path d="M 110 66 C 110 156 159 220 433 249" fill="none" stroke="#cc7650" stroke-width="4" stroke-linecap="round"/><text x="389" y="237" fill="#b66748" font-weight="700" font-size="15">PK₀</text>`;
let second=type==='long'?`<path d="M 270 25 L 270 290" stroke="#0b8177" stroke-width="3.5"/><text x="281" y="45" font-size="13" fill="#0b8177" font-weight="750">Dlhodobá PK</text><text x="255" y="310" fill="#445761" font-size="13">u*</text>`:'';

let AD0=`<path d="M 113 91 L 442 232" fill="none" stroke="#db725c" stroke-width="3.8" stroke-linecap="round"/><text x="444" y="233" font-size="15" fill="#ad604c" font-weight="700">AD₀</text>`;
let AS0=`<path d="M 110 270 L 439 89" fill="none" stroke="#0a8c83" stroke-width="3.8" stroke-linecap="round"/><text x="440" y="88" font-size="15" fill="#0a726a" font-weight="700">AS₀</text>`;
let AD1=`<path d="M 113 67 L 442 208" fill="none" stroke="#db725c" stroke-width="3.8" stroke-dasharray="9 5" stroke-linecap="round"/><text x="444" y="210" font-size="15" fill="#ad604c" font-weight="700">AD₁</text>`;
let AS1=`<path d="M 56 263 L 385 82" fill="none" stroke="#0a8c83" stroke-width="3.8" stroke-dasharray="9 5" stroke-linecap="round"/><text x="386" y="79" font-size="15" fill="#0a726a" font-weight="700">AS₁</text>`;
let E0=`<circle cx="276" cy="161" r="5" fill="#152f40"/><text x="280" y="179" font-size="13" fill="#152f40">E₀</text>`;
let newX=type==='cost'?246:type==='demand'?300:276;
let newY=type==='cost'?145:type==='demand'?149:137;
let E1=`<circle cx="${newX}" cy="${newY}" r="5" fill="#172f40"/><text x="${newX+8}" y="${newY-8}" font-size="13" fill="#172f40">E₁</text><path d="M ${newX} ${newY} L 54 ${newY} M ${newX} ${newY} L ${newX} 291" stroke="#6a7f81" stroke-dasharray="5 6" fill="none" stroke-width="1.5"/>`;
return `<svg viewBox="0 0 520 325" role="img" aria-label="Model AD a AS s posunom krivky ${type}" xmlns="http://www.w3.org/2000/svg">${grid}<text x="30" y="23" font-size="18" font-weight="800" fill="#26394b">P</text><text x="495" y="317" font-size="18" font-weight="800" fill="#26394b">Y</text>${AD0}${AS0}${E0}${after?(type==='cost'?AS1:type==='demand'?AD1:AD1+AS1)+E1:''}${after?'<text x="92" y="314" font-size="11" fill="#61767b">— pôvodne &nbsp; - - po zmene</text>':''}</svg>`;
}
function historySVG(){let vals=HIST.map(h=>h[1]),min=-2,max=15,W=520,H=265,l=35,r=12,t=17,b=45,px=(W-l-r)/(HIST.length-1),y=v=>t+(max-v)/(max-min)*(H-t-b),points=vals.map((v,i)=>`${l+i*px},${y(v)}`).join(' '),target=HIST.findIndex(x=>x[0]===s.openedHistory),x=l+target*px;return `<svg class="timeline" viewBox="0 0 520 265" role="img" aria-label="Graf miery inflácie Slovenska 2005 až 2023 podľa údajov z vyplneného praktika" xmlns="http://www.w3.org/2000/svg"><g stroke="#e0e7e3" stroke-width="1">${[0,5,10,15].map(v=>`<line x1="${l}" x2="508" y1="${y(v)}" y2="${y(v)}"/>`).join('')}</g><g fill="#60717b" font-size="12">${[0,5,10,15].map(v=>`<text x="7" y="${y(v)+4}">${v}</text>`).join('')}<text x="${l}" y="251">2005</text><text x="268" y="251">2014</text><text x="467" y="251">2023</text></g><line x1="${l}" y1="17" x2="${l}" y2="${H-b}" stroke="#334d58"/><line x1="${l}" y1="${H-b}" x2="508" y2="${H-b}" stroke="#334d58"/><polyline points="${points}" fill="none" stroke="#087f78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="${x}" y1="${t}" x2="${x}" y2="${H-b}" stroke="#dc845e" stroke-dasharray="3 5"/><circle cx="${x}" cy="${y(HIST[target][1])}" r="5.4" fill="#dc845e" stroke="white" stroke-width="2"/><text x="${Math.min(x+10,447)}" y="${Math.max(y(HIST[target][1])-9,18)}" font-size="13" font-weight="800" fill="#c56b4a">${HIST[target][1].toFixed(1).replace('.',',')} %</text></svg>`;}

function renderHelp(){return `<section class="panel content" style="max-width:760px;margin:auto"><div class="eyebrow">NÁVOD</div><h2>🕵️ Ako hrať Inflation Detectives</h2><p>Hráš <b>individuálne</b>. Pri každom prípade najprv otvor tri dôkazy. Potom rieš ekonomické záhady, vyhodnocuj tvrdenia a čítaj grafy. Nič nemusíš počítať.</p><div class="rules"><div class="rule"><i>1️⃣</i><div><b>Prečítaj dôkazy</b><span>Vždy sa dajú znovu otvoriť. Kľúčové informácie máš aj vo svojom zápisníku.</span></div></div><div class="rule"><i>2️⃣</i><div><b>Over vlastný úsudok</b><span>Za odpoveď na prvý pokus získavaš 10 bodov. Ďalšie pokusy a nápovedy znižujú bodový zisk, ale hra ťa nikdy nezablokuje.</span></div></div><div class="rule"><i>3️⃣</i><div><b>Vysvetli si graf</b><span>Najprv si predstav príbeh: rastú náklady? rastú nákupy? Až potom voľ krivku a smer posunu.</span></div></div><div class="rule"><i>4️⃣</i><div><b>Skóre a odovzdanie</b><span>Na konci uvidíš svoje skóre. Urob screenshot s menom a pošli ho vyučujúcej súkromne cez MS Teams.</span></div></div></div><p class="muted twelve">Približná dĺžka: 45–60 minút. Bez počítania. Možnosti odpovedí sú pri každom novom začatí hry premiešané; počas konkrétnej úlohy zostanú na rovnakom mieste. Bez registrácie a bez internetu. Ukladanie funguje v lokálnom úložisku prehliadača na rovnakom zariadení. Pri vymazaní dát prehliadača sa postup stratí.</p><button class="primary" data-action="closeHelp">← Späť do hry</button></section>`;}
function check(){
 let p=P(s.current),t=CASES[s.current].steps[p.step];
 if(!t||p.feedback?.good)return;
 const order=optionOrder(s.current,p.step,t);
 const chosen=p.selection.map(displayIndex=>order[displayIndex]);
 let good=t.kind==='multi'
   ? chosen.length===t.answer.length && t.answer.every(idx=>chosen.includes(idx))
   : chosen.length===1 && chosen[0]===t.answer;
 if(good){
   const attempts=p.attempts||0;
   const tier=attempts===0?10:attempts===1?7:attempts===2?4:2;
   const earned=Math.max(1,tier-(p.hintUsed?2:0));
   p.feedback={good:true,earned};s.xp+=earned;
 }else{
   p.attempts=(p.attempts||0)+1;
   s.wrongAnswers=(s.wrongAnswers||0)+1;
   p.feedback={good:false,message:'Zatiaľ nie. Pozri ešte raz dôkazy a polož si otázku: čo sa v skutočnosti zmenilo? Môžeš skúšať znova.'};
 }
 render();
}
function eventAction(e){let button=e.target.closest('[data-action]');if(!button)return;const a=button.dataset.action,i=Number(button.dataset.i);let p=P(s.current);
if(a==='start'){let v=document.getElementById('agentName')?.value.trim();if(!v){alert('Najprv napíš svoje meno a priezvisko, aby sme ti mohli založiť vyšetrovací spis.');return;}s.name=v.substring(0,65);s.current=0;prepareOptions();render();}
if(a==='help'){s.showHelp=true;render();}if(a==='closeHelp'){s.showHelp=false;render();}
if(a==='evidence'){if(!p.seen.includes(i))p.seen.push(i);render();}
if(a==='investigate'){if(p.seen.length===3){p.phase='task';render();}}
if(a==='option'){if(p.feedback?.good)return;let t=CASES[s.current].steps[p.step];if(t.kind==='multi'){p.selection=p.selection.includes(i)?p.selection.filter(x=>x!==i):[...p.selection,i];}else{p.selection=[i];}p.feedback=null;render();}
if(a==='check'){check();}
if(a==='hint'){let t=CASES[s.current].steps[p.step];if(!p.hintUsed){p.hintUsed=true;s.hintsUsed=(s.hintsUsed||0)+1;}p.feedback={good:false,message:'💡 '+t.hint};render();}
if(a==='nexttask'){if(!p.feedback?.good)return;p.step++;p.selection=[];p.feedback=null;p.attempts=0;p.hintUsed=false;if(p.step>=CASES[s.current].steps.length){if(!s.completed.includes(s.current))s.completed.push(s.current);}render();}
if(a==='nextcase'){if(s.completed.length===CASES.length){render();return;}s.current=s.completed.length;render();}
if(a==='case'){if(canVisit(i)){s.current=i;render();}}
if(a==='year'){s.openedHistory=Number(button.dataset.year);render();}
if(a==='print'){window.print();}
if(a==='restart'){if(confirm('Naozaj chceš zmazať celý doterajší postup a začať od začiatku?')){s=fresh();render();}}
}
document.addEventListener('click',eventAction);
document.addEventListener('input',e=>{if(e.target.id==='memo'){s.notes[s.current]=e.target.value;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='agentName'){e.preventDefault();document.querySelector('[data-action="start"]')?.click();}});
render();
</script></body></html>
